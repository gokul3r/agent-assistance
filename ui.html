<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alfie Quote Search - Time Lapse</title>
  <script src="alfie.config.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --accent: #38bdf8;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --danger: #f87171;
      --success: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(56,189,248,0.08), transparent 25%),
                  radial-gradient(circle at 80% 0%, rgba(59,130,246,0.08), transparent 20%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 16px 64px;
    }
    .shell {
      width: min(1100px, 100%);
      background: linear-gradient(145deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      padding: 28px;
      backdrop-filter: blur(6px);
    }
    h1 {
      margin: 0 0 4px;
      font-size: 24px;
      letter-spacing: -0.02em;
    }
    p.lead { margin: 0 0 20px; color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px 16px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    textarea { min-height: 80px; resize: vertical; }
    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
      margin: 12px 0 16px;
    }
    button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 14px;
      cursor: pointer;
      color: #0b1224;
      background: var(--accent);
      font-weight: 600;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      box-shadow: 0 12px 30px rgba(56,189,248,0.25);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .confirm-bar {
      display: none;
    }
    .log {
      background: #0b1224;
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 14px;
      padding: 12px;
      min-height: 160px;
      max-height: 320px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
      color: #e2e8f0;
    }
    .log-entry { margin: 0 0 6px; }
    .log-entry .date { color: var(--muted); }
    .log-entry.match { color: var(--success); }
    .log-entry.search { color: var(--muted); }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(56,189,248,0.15);
      border: 1px solid rgba(56,189,248,0.4);
      color: var(--text);
      font-size: 11px;
      margin-left: 6px;
    }
    .row-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .muted { color: var(--muted); font-size: 12px; }
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 20;
    }
    .modal-content {
      background: #0b1224;
      border-radius: 16px;
      padding: 20px;
      width: min(520px, 95vw);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    }
    .modal h3 { margin: 0 0 8px; }
    .modal .row { display: flex; justify-content: space-between; margin: 6px 0; color: var(--muted); }
    .modal .row strong { color: var(--text); }
    .modal-actions { display: flex; gap: 10px; margin-top: 14px; }
    .btn-secondary { background: rgba(255,255,255,0.1); color: var(--text); box-shadow: none; }
    .card-box {
      margin-top: 10px;
      padding: 10px 12px;
      background: rgba(56,189,248,0.08);
      border: 1px solid rgba(56,189,248,0.25);
      border-radius: 12px;
      font-family: 'JetBrains Mono','SFMono-Regular',Consolas,monospace;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <h1>Alfie Schedule Run (UI POC)</h1>
    <p class="lead">Edit your policy and preference details, then hit “Time lapse” to simulate weekly searches (1s per week).</p>

    <div class="grid">
      <div>
        <label for="policy_number">Policy Number</label>
        <input id="policy_number" value="A12345" />
      </div>
      <div>
        <label for="policy_cost">Policy Cost (£)</label>
        <input id="policy_cost" type="number" step="0.01" value="456" />
      </div>
      <div>
        <label for="email_id">Email</label>
        <input id="email_id" value="gokul@example.com" />
      </div>
      <div>
        <label for="driver_age">Driver Age</label>
        <input id="driver_age" type="number" min="18" max="100" value="35" />
      </div>
      <div>
        <label for="vehicle_registration_number">Vehicle Reg</label>
        <input id="vehicle_registration_number" value="AB12 CDE" />
      </div>
      <div>
        <label for="vehicle_manufacturer_name">Manufacturer</label>
        <input id="vehicle_manufacturer_name" value="Tesla" />
      </div>
      <div>
        <label for="vehicle_model">Model</label>
        <input id="vehicle_model" value="Model 3" />
      </div>
      <div>
        <label for="vehicle_year">Year</label>
        <input id="vehicle_year" type="number" value="2021" />
      </div>
      <div>
        <label for="type_of_fuel">Fuel</label>
        <input id="type_of_fuel" value="Electric" />
      </div>
      <div>
        <label for="type_of_Cover_needed">Cover Type</label>
        <input id="type_of_Cover_needed" value="comprehensive" />
      </div>
      <div>
        <label for="No_Claim_bonus_years">NCB Years</label>
        <input id="No_Claim_bonus_years" type="number" value="5" />
      </div>
      <div>
        <label for="Voluntary_Excess">Voluntary Excess</label>
        <input id="Voluntary_Excess" type="number" step="0.01" value="500" />
      </div>
      <div>
        <label for="current_insurance_provider">Current Provider</label>
        <input id="current_insurance_provider" value="Admiral" />
      </div>
      <div>
        <label for="policy_id">Policy ID</label>
        <input id="policy_id" value="POL-123" />
      </div>
      <div>
        <label for="policy_type">Policy Type</label>
        <input id="policy_type" value="car" />
      </div>
      <div>
        <label for="policy_end_date">Policy End Date</label>
        <input id="policy_end_date" value="2026-11-22" />
      </div>
      <div>
        <label for="policy_start_date">Policy Start Date</label>
        <input id="policy_start_date" value="2025-11-23" />
      </div>
      <div>
        <label for="user_preferences">User Preferences</label>
        <textarea id="user_preferences">I need courtesy_car and the legal_cover with max budget £380</textarea>
      </div>
      <div>
        <label for="start_date">Start Date (YYYY-MM-DD)</label>
        <input id="start_date" value="2025-11-23" />
      </div>
      <div>
        <label for="iterations">Max Iterations</label>
        <input id="iterations" type="number" value="20" min="1" max="50" />
      </div>
    </div>

    <div class="actions">
      <button id="startBtn">Time lapse</button>
      <span class="muted">Simulates weekly runs (1s apart) and asks confirmation on the first match.</span>
    </div>

    <div id="confirmBar" class="confirm-bar">
    </div>

    <div class="log" id="log"></div>
  </div>

  <div class="modal" id="confirmModal">
    <div class="modal-content">
      <h3>Confirm policy switch</h3>
      <div id="confirmDetails"></div>
      <div class="card-box">Paying with saved card: **** **** **** 4242 (mock)</div>
      <div class="modal-actions">
        <button id="modalConfirm" class="confirm-btn">Confirm purchase</button>
        <button id="modalCancel" class="btn-secondary">Keep searching</button>
      </div>
    </div>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const logEl = document.getElementById('log');
    const confirmModal = document.getElementById('confirmModal');
    const confirmDetails = document.getElementById('confirmDetails');
    const modalConfirm = document.getElementById('modalConfirm');
    const modalCancel = document.getElementById('modalCancel');

    let timer = null;
    let iteration = 0;
    let runDate = null;
    let pendingMatch = null;

    function getVal(id) { return document.getElementById(id).value; }

    function addLog(line, cssClass = '') {
      const div = document.createElement('div');
      div.className = 'log-entry ' + cssClass;
      div.textContent = line;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function nextRunDate(start, offsetWeeks) {
      const d = new Date(start);
      d.setDate(d.getDate() + offsetWeeks * 7);
      return d.toISOString().slice(0, 10);
    }

    const FEATURE_ALIASES = {
      'legal': 'legal_cover',
      'legal cover': 'legal_cover',
      'legal_cover': 'legal_cover',
      'windshield': 'windshield_cover',
      'windscreen': 'windshield_cover',
      'windshield cover': 'windshield_cover',
      'windscreen cover': 'windshield_cover',
      'windshield_cover': 'windshield_cover',
      'windscreen_cover': 'windshield_cover',
      'courtesy': 'courtesy_car',
      'courtesy car': 'courtesy_car',
      'courtesy_car': 'courtesy_car',
      'breakdown': 'breakdown_cover',
      'breakdown cover': 'breakdown_cover',
      'breakdown_cover': 'breakdown_cover',
      'european': 'european_cover',
      'european cover': 'european_cover',
      'european_cover': 'european_cover'
    };

    function normalizeFeatures(list) {
      return list.map(f => f.replace(/_included$/, '').toLowerCase());
    }

    function parsePreferencesText(text) {
      const t = text.toLowerCase();
      const budgetMatch = t.match(/(?:£|gbp|budget|max|under|below)\s*([0-9]+(?:\.[0-9]+)?)/);
      const budget = budgetMatch ? parseFloat(budgetMatch[1]) : null;

      const trustMatch = t.match(/trustpilot[^0-9]*([0-9](?:\.[0-9])?)/);
      const minTrust = trustMatch ? parseFloat(trustMatch[1]) : null;

      const found = [];
      Object.keys(FEATURE_ALIASES).forEach(key => {
        const regex = new RegExp(`\\b${key.replace('_','[_\\s]?')}\\b`, 'i');
        if (regex.test(text) && !found.includes(FEATURE_ALIASES[key])) {
          found.push(FEATURE_ALIASES[key]);
        }
      });
      return { budget, minTrust, features: found };
    }

    const API_BASE = ((window.ALFIE_API_BASE || 'http://localhost:8080').replace(/\/$/, ''));

    async function callAgent(payload) {
      const res = await fetch(`${API_BASE}/complete-analysis`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) {
        throw new Error(`API error ${res.status}`);
      }
      return res.json();
    }

    function pickBestMatch(data, prefs) {
      const budget = prefs.budget;
      const required = (prefs.features || []).map(f => f.toLowerCase());
      const minTrust = prefs.minTrust;
      const quotes = data.quotes_with_insights || [];

      let candidates = [];
      for (const q of quotes) {
        const price = q.price_analysis?.quote_price ?? q.original_quote?.output?.policy_cost;
        if (price == null) continue;
        if (budget != null && price > budget) continue;

        const featuresRaw = q.available_features || [];
        const features = normalizeFeatures(featuresRaw);

        if (required.length) {
          const missing = required.filter(f => !features.includes(f));
          if (missing.length) continue;
        }

        const rating = q.trust_pilot_context?.rating;
        if (minTrust != null && rating != null && rating < minTrust) continue;

        candidates.push({
          insurer: q.insurer_name || q.original_quote?.output?.insurer_name || 'Unknown',
          price: price,
          features: features,
          quote_id: q.original_quote?.output?.quote_reference_number || q.insurer_name || 'QUOTE',
          rating: rating
        });
      }

      if (!candidates.length) return null;
      candidates.sort((a, b) => a.price - b.price);
      return candidates[0];
    }

    function buildPayload() {
      return {
        insurance_details: {
          email_id: getVal('email_id'),
          driver_age: Number(getVal('driver_age')),
          vehicle_registration_number: getVal('vehicle_registration_number'),
          vehicle_manufacturer_name: getVal('vehicle_manufacturer_name'),
          vehicle_model: getVal('vehicle_model'),
          vehicle_year: Number(getVal('vehicle_year')),
          type_of_fuel: getVal('type_of_fuel'),
          type_of_Cover_needed: getVal('type_of_Cover_needed'),
          No_Claim_bonus_years: Number(getVal('No_Claim_bonus_years')),
          Voluntary_Excess: Number(getVal('Voluntary_Excess')),
          current_insurance_provider: getVal('current_insurance_provider'),
          policy_id: getVal('policy_id'),
          policy_type: getVal('policy_type'),
          policy_start_date: getVal('policy_start_date'),
          policy_end_date: getVal('policy_end_date'),
        },
        user_preferences: getVal('user_preferences'),
        conversation_history: []
      };
    }

    function setUIState(running) {
      startBtn.disabled = running;
    }

    function computeRefund(policyCost, endDateStr) {
      const today = new Date();
      const end = new Date(endDateStr);
      const msPerDay = 1000 * 60 * 60 * 24;
      const remainingDays = Math.max(0, Math.round((end - today) / msPerDay));
      const refund = policyCost * (remainingDays / 365);
      return { remainingDays, refund };
    }

    async function runOnce(prefs) {
      const payload = buildPayload();
      try {
        const data = await callAgent(payload);
        const match = pickBestMatch(data, prefs);
        if (match) {
          pendingMatch = match;
          showConfirmation(match, prefs);
          addLog(`date: ${runDate}, match_found: yes, message: found ${match.insurer} quote for £${match.price.toFixed(2)} within budget with requested features`, 'match');
          clearInterval(timer);
          timer = null;
          setUIState(false);
        } else {
          addLog(`date: ${runDate}, searching...`, 'search');
        }
      } catch (err) {
        addLog(`date: ${runDate}, error: ${err.message}`, 'search');
        clearInterval(timer);
        timer = null;
        setUIState(false);
      }
    }

    function startLoop() {
      if (timer) return;
      const startDateStr = getVal('start_date');
      const maxIter = Number(getVal('iterations')) || 20;
      const prefs = parsePreferencesText(getVal('user_preferences'));
      iteration = 0;
      pendingMatch = null;
      addLog('--- starting time lapse ---');
      setUIState(true);
      runDate = nextRunDate(startDateStr, iteration);
      runOnce(prefs);
      timer = setInterval(() => {
        iteration += 1;
        if (iteration >= maxIter) {
          addLog('Max iterations reached. Stopping.');
          clearInterval(timer);
          timer = null;
          setUIState(false);
          return;
        }
        runDate = nextRunDate(startDateStr, iteration);
        runOnce(prefs);
      }, 1000);
    }

    function showConfirmation(match, prefs) {
      const currentCost = parseFloat(getVal('policy_cost')) || 0;
      const cancellationFee = 10;
      const { refund, remainingDays } = computeRefund(currentCost, getVal('policy_end_date'));

      // Upfront: new premium + fee - refund.
      const cashImpact = (match.price + cancellationFee) - refund;
      // Annual delta: old premium - new premium - fee (refund is one-time, excluded here).
      const annualDelta = currentCost - match.price - cancellationFee;

      const trustNote = match.rating ? `Trustpilot: ${match.rating.toFixed(1)}` : 'Trustpilot: n/a';
      const featuresList = (prefs.features || []).join(', ') || 'No specific features';

      const cashLabel = cashImpact >= 0 ? `Pay now £${cashImpact.toFixed(2)}` : `Receive back £${Math.abs(cashImpact).toFixed(2)}`;
      const annualLabel = annualDelta >= 0 ? `Saving £${annualDelta.toFixed(2)} per year` : `Extra £${Math.abs(annualDelta).toFixed(2)} per year`;

      confirmDetails.innerHTML = `
        <div class="row"><span>New quote</span><strong>£${match.price.toFixed(2)} (${match.insurer})</strong></div>
        <div class="row"><span>Current cost</span><strong>£${currentCost.toFixed(2)}</strong></div>
        <div class="row"><span>Cancellation fee</span><strong>£${cancellationFee.toFixed(2)}</strong></div>
        <div class="row"><span>Pro-rata refund (~${remainingDays} days)</span><strong>£${refund.toFixed(2)}</strong></div>
        <div class="row"><span>Upfront impact</span><strong>${cashLabel}</strong></div>
        <div class="row"><span>Annual premium delta</span><strong>${annualLabel}</strong></div>
        <div class="row"><span>Features required</span><strong>${featuresList}</strong></div>
        <div class="row"><span>Rating</span><strong>${trustNote}</strong></div>
      `;
      confirmModal.style.display = 'flex';
    }

    async function callAction(url, body) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error(`${url} failed`);
      return res.json();
    }

    modalConfirm.addEventListener('click', async () => {
      if (!pendingMatch) return;
      confirmModal.style.display = 'none';
      const paymentToken = 'tok_mock_4242';
      try {
        await callAction(`${API_BASE}/buy_policy`, {
          policy_id: pendingMatch.quote_id,
          insurer_name: pendingMatch.insurer,
          quote_reference_number: pendingMatch.quote_id,
          payment_token: paymentToken
        });
        await callAction(`${API_BASE}/cancel_policy`, {
          policy_id: getVal('policy_id'),
          insurer_name: getVal('current_insurance_provider'),
          reason: 'switch_to_new_policy'
        });
        document.getElementById('policy_id').value = pendingMatch.quote_id;
        addLog(`Policy confirmed with ${pendingMatch.insurer}. New policy ID: ${pendingMatch.quote_id}`, 'match');
        pendingMatch = null;
      } catch (err) {
        addLog(`Error confirming policy: ${err.message}`, 'search');
        pendingMatch = null;
      }
    });

    modalCancel.addEventListener('click', () => {
      confirmModal.style.display = 'none';
      pendingMatch = null;
      // Resume loop if stopped
      if (!timer) {
        startLoop();
      }
    });

    startBtn.addEventListener('click', startLoop);
  </script>
</body>
</html>
